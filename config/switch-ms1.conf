! Sample configuration: Catalyst 3750 v2 multilayer switch MS1 (IOS 12.2),
! Trusted Repeater lab. Credentials and the self-signed certificate are
! redacted. Runs of empty "!" lines are condensed.
!
version 12.2
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname MS1
!
boot-start-marker
boot-end-marker
!
enable secret 5 <REDACTED>
!
username admin secret 5 <REDACTED>
no aaa new-model
switch 1 provision ws-c3750v2-48ts
system mtu routing 1500
ip subnet-zero
no ip domain-lookup
ip domain-name example.com
!
crypto pki trustpoint TP-self-signed-530842624
 enrollment selfsigned
 subject-name cn=IOS-Self-Signed-Certificate-530842624
 revocation-check none
 rsakeypair TP-self-signed-530842624
!
crypto pki certificate chain TP-self-signed-530842624
! certificate omitted
!
spanning-tree mode pvst
spanning-tree extend system-id
!
vlan internal allocation policy ascending
!
ip ssh version 2
!
! Interfaces FastEthernet1/0/1 to 1/0/48 and GigabitEthernet1/0/1 to 1/0/4
! carry no configuration and are omitted.
!
interface Vlan1
 ip address 192.168.1.2 255.255.255.0
!
ip default-gateway 192.168.1.1
ip classless
ip http server
ip http secure-server
!
control-plane
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
line vty 5 15
 login
!
end
