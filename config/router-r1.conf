! ==========================================================================
! SAMPLE CONFIGURATION
!
! Device:    Router R1, Cisco 2911 (IOS 15.7), the edge router of the Trusted
!            Repeater reference topology.
! Role:      Policy-based routing (ACL matchICMP, route map icmpRedirect)
!            sends ICMP from 192.168.1.0/24 and 192.168.10.0/24 to the
!            Trusted Repeater at 192.168.5.3 on GigabitEthernet0/0.
! Redacted:  Credentials and identifiers are placeholders: password hashes
!            (<REDACTED>), the local username (admin), the device serial
!            number (<REDACTED>), and the domain name (example.com). Replace
!            them with site values before use.
! Condensed: Runs of empty "!" lines from show running-config are removed.
! ==========================================================================
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
enable secret 5 <REDACTED>
!
no aaa new-model
!
no ip domain lookup
ip domain name example.com
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
voice-card 0
!
vxml logging-tag
license udi pid CISCO2911/K9 sn <REDACTED>
hw-module pvdm 0/0
!
username admin secret 5 <REDACTED>
!
redundancy
!
interface Embedded-Service-Engine0/0
 no ip address
 shutdown
!
interface GigabitEthernet0/0
 ip address 192.168.5.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 192.168.10.1 255.255.255.0
 ip policy route-map icmpRedirect
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 ip address 192.168.1.1 255.255.255.0
 ip policy route-map icmpRedirect
 duplex auto
 speed auto
!
interface Serial0/0/0
 no ip address
 shutdown
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip ssh version 2
!
ip access-list extended matchICMP
 permit icmp 192.168.1.0 0.0.0.255 any
 permit icmp 192.168.10.0 0.0.0.255 any
!
ipv6 ioam timestamp
!
! Policy-based routing redirect: ICMP sourced from the internal subnets
! 192.168.1.0/24 and 192.168.10.0/24 (ACL matchICMP) is sent to next hop
! 192.168.5.3, the repeater host, instead of following the normal route.
! The route map is bound with "ip policy route-map icmpRedirect" on
! GigabitEthernet0/1 and GigabitEthernet0/2 above.
route-map icmpRedirect permit 10
 match ip address matchICMP
 set ip next-hop 192.168.5.3
!
control-plane
!
voice-port 0/1/0
!
voice-port 0/1/1
!
voice-port 0/1/2
!
voice-port 0/1/3
!
mgcp behavior rsip-range tgcp-only
mgcp behavior comedia-role none
mgcp behavior comedia-check-media-src disable
mgcp behavior comedia-sdp-force disable
!
mgcp profile default
!
gatekeeper
 shutdown
!
line con 0
 logging synchronous
line aux 0
line 2
 no activation-character
 no exec
 transport preferred none
 transport output lat pad telnet rlogin lapb-ta mop udptn v120 ssh
 stopbits 1
line vty 0 4
 login local
 transport input ssh
!
scheduler allocate 20000 1000
!
end
